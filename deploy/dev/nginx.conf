map $http_x_apboa_thread_id $runtime_hash_key {
    default $http_x_apboa_thread_id;
    "" $remote_addr;
}

upstream apboa_runtime_dev {
    hash $runtime_hash_key consistent;
    server runtime:3061 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = / {
        return 302 /react/;
    }

    # 兼容旧 Vue 文档子应用入口，内容已迁移至 React 使用手册。
    location = /web/doc {
        return 302 /react/docs;
    }

    location /web/doc/ {
        return 302 /react/docs;
    }

    location /react/ {
        alias /usr/share/nginx/html/react/;
        try_files $uri $uri/ /react/index.html;
    }

    location /api/runtime/ {
        proxy_pass http://apboa_runtime_dev/runtime/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Apboa-Thread-Id $http_x_apboa_thread_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ws/ {
        proxy_pass http://websocket:3064/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://console:3060/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /runtime/agui/ {
        proxy_pass http://apboa_runtime_dev/runtime/agui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Apboa-Thread-Id $http_x_apboa_thread_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
