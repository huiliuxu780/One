name: apboa-dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sql/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
      - ./mysql/10-flyway-grants.sh:/docker-entrypoint-initdb.d/10-flyway-grants.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    cpus: 1.0
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
    mem_limit: 256m
    cpus: 0.5
    networks: [backend]

  console:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.console
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      CONSOLE_JAVA_HEAP_PERCENTAGE: "62.5"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_HOST: websocket
      WEBSOCKET_PORT: "3064"
      TZ: Asia/Shanghai
    volumes:
      - app_data:/app/.apboa
      - console_logs:/app/logs
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1280m
    cpus: 1.5
    networks: [backend]

  proxy:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.proxy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:exec,size=128m
    working_dir: /tmp
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/tmp -Dspring.pid.file=
      CONSOLE_HOST: console
      SHELL_DEFAULT_TIMEOUT: "300"
      SHELL_MAX_TIMEOUT: "1800"
      SHELL_MAX_OUTPUT_SIZE: "10485760"
      SHELLPROXY_JAVA_HEAP_PERCENTAGE: "50.0"
      PIP_TARGET: /opt/tools/pylib
      PYTHONPATH: /opt/tools/pylib
      NPM_CONFIG_PREFIX: /opt/tools/npm-global
      APBOA_NODE_ID: proxy-dev
      APBOA_HOST_NAME: proxy
      APBOA_HOST_IP: proxy
      TZ: Asia/Shanghai
    volumes:
      - proxy_logs:/app/logs
      - app_data:/app/.apboa
      - proxy_tools:/opt/tools
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    networks: [backend]

  runtime:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.runtime
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      VECTOR_STORE_TYPE: none
      SHELL_PROXY_ENABLED: "true"
      PROXY_HOST: proxy
      PROXY_PORT: "3062"
      CONSOLE_HOST: console
      RUNTIME_JAVA_HEAP_PERCENTAGE: "60.0"
      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_HOST: websocket
      WEBSOCKET_PORT: "3064"
      WORKSPACE_CAPACITY_MB: "30"
      APBOA_NODE_ID: runtime-dev-1
      APBOA_HOST_NAME: runtime
      APBOA_HOST_IP: runtime
      PIP_TARGET: /opt/tools/pylib
      PYTHONPATH: /opt/tools/pylib
      NPM_CONFIG_PREFIX: /opt/tools/npm-global
      TZ: Asia/Shanghai
    volumes:
      - runtime_logs:/app/logs
      - app_data:/app/.apboa
      - runtime_tools:/opt/tools
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      console: { condition: service_started }
      proxy: { condition: service_started }
    mem_limit: 2304m
    cpus: 2.0
    networks: [backend]

  # API 服务数据面。仅在明确验收 API 服务时通过 --profile gateway 启动。
  # 与上游 host 网络部署不同，开发环境不发布动态应用端口到宿主机；
  # 已上线 API 只在 backend 网络内可达，避免绕过 Nginx/TLS 暴露公网。
  gateway:
    profiles: [gateway]
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      VECTOR_STORE_TYPE: none
      CONSOLE_HOST: console
      SHELL_PROXY_ENABLED: "true"
      PROXY_HOST: proxy
      PROXY_PORT: "3062"
      GATEWAY_JAVA_HEAP_PERCENTAGE: "55.0"
      APBOA_NODE_ID: gateway-dev-1
      APBOA_HOST_NAME: gateway
      APBOA_HOST_IP: gateway
      TZ: Asia/Shanghai
    volumes:
      - gateway_logs:/app/logs
      - app_data:/app/.apboa
      - runtime_tools:/opt/tools
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      console: { condition: service_started }
      proxy: { condition: service_started }
    mem_limit: 768m
    cpus: 1.0
    networks: [backend]

  websocket:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.websocket
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      CONSOLE_HOST: console
      WEBSOCKET_JAVA_HEAP_PERCENTAGE: "50.0"
      TZ: Asia/Shanghai
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 384m
    cpus: 0.5
    networks: [backend]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - ${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-80}:80
    depends_on:
      console: { condition: service_started }
      runtime: { condition: service_started }
      websocket: { condition: service_started }
    mem_limit: 128m
    cpus: 0.5
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  mysql_data:
  redis_data:
  app_data:
  console_logs:
  proxy_logs:
  runtime_logs:
  proxy_tools:
  runtime_tools:
  gateway_logs:
